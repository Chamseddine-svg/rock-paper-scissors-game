<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors - Retro</title>
    <!-- External retro-style CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>ROCK PAPER SCISSORS</h1>

    <!-- Game info panel: shows total rounds and current round -->
    <div class="info-panel" data-testid="game-info">
        GAMES: <span id="total-rounds-display" data-testid="total-rounds">0</span>
        | ROUND: <span id="current-round" data-testid="current-round">0</span>
    </div>

    <!-- Computer's current choice display (visual feedback) -->
    <div class="choice-area" data-testid="computer-choice-area">
        COMPUTER CHOOSES: <span id="computer-choice-display" data-testid="computer-choice">---</span>
    </div>

    <!-- Player action buttons -->
    <div class="buttons">
        <button id="rock" data-testid="rock-btn">ROCK</button>
        <button id="paper" data-testid="paper-btn">PAPER</button>
        <button id="scissors" data-testid="scissors-btn">SCISSORS</button>
    </div>

    <!-- Live scoreboard -->
    <div class="scoreboard" data-testid="scoreboard">
        YOU: <span id="human-score" data-testid="human-score">0</span> &nbsp;|&nbsp;
        CPU: <span id="computer-score" data-testid="computer-score">0</span>
    </div>

    <!-- Round result message -->
    <div class="result-area" data-testid="round-result"></div>

    <!-- Final winner announcement -->
    <div class="winner-area" data-testid="winner-message"></div>

    <!-- Reset / new game button -->
    <div>
        <button id="reset" class="reset-btn" data-testid="reset-btn">NEW GAME</button>
    </div>

    <footer>ENTER NUMBER OF GAMES TO START</footer>

    <!-- Game logic script -->
    <script src="index.JS"></script>
</body>
</html>
