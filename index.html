<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors - Retro</title>
    <style>
        body {
            background: #000;
            color: #0f0;
            font-family: 'Courier New', monospace;
            text-align: center;
            margin-top: 30px;
        }
        h1 {
            font-size: 1.8rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            border-bottom: 2px solid #0f0;
            display: inline-block;
            padding-bottom: 8px;
        }
        .info-panel {
            margin: 20px auto;
            padding: 8px;
            border: 1px solid #0f0;
            width: 300px;
            background: #001000;
        }
        .buttons {
            margin: 20px 0;
        }
        button {
            background: #000;
            color: #0f0;
            border: 2px solid #0f0;
            font-family: 'Courier New', monospace;
            font-size: 1.1rem;
            padding: 6px 14px;
            margin: 0 8px;
            cursor: pointer;
            text-transform: uppercase;
        }
        button:hover:not(:disabled) {
            background: #0f0;
            color: #000;
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .scoreboard {
            font-size: 1.3rem;
            margin: 15px;
            padding: 8px;
            border: 1px dashed #0f0;
            display: inline-block;
            min-width: 260px;
        }
        .result-area {
            font-size: 1.1rem;
            margin: 15px auto;
            padding: 8px;
            border: 1px dotted #0f0;
            width: 80%;
            max-width: 500px;
            min-height: 60px;
            background: #001000;
        }
        .winner-area {
            font-size: 1.3rem;
            font-weight: bold;
            margin: 15px;
            padding: 8px;
            background: #0f0;
            color: #000;
            display: inline-block;
        }
        .reset-btn {
            margin-top: 15px;
            background: #330000;
            border-color: #f00;
            color: #f77;
        }
        footer {
            margin-top: 30px;
            font-size: 0.75rem;
            color: #0a0;
        }
    </style>
</head>
<body>
    <h1>ROCK PAPER SCISSORS</h1>

    <div class="info-panel" data-testid="game-info">
        GAMES: <span id="total-rounds-display" data-testid="total-rounds">0</span>
        | ROUND: <span id="current-round" data-testid="current-round">0</span>
    </div>

    <div class="buttons">
        <button id="rock" data-testid="rock-btn">ROCK</button>
        <button id="paper" data-testid="paper-btn">PAPER</button>
        <button id="scissors" data-testid="scissors-btn">SCISSORS</button>
    </div>

    <div class="scoreboard" data-testid="scoreboard">
        YOU: <span id="human-score" data-testid="human-score">0</span> &nbsp;|&nbsp;
        CPU: <span id="computer-score" data-testid="computer-score">0</span>
    </div>

    <div class="result-area" data-testid="round-result">
        <!-- round result -->
    </div>

    <div class="winner-area" data-testid="winner-message">
        <!-- final winner message -->
    </div>

    <div>
        <button id="reset" class="reset-btn" data-testid="reset-btn">NEW GAME</button>
    </div>

    <footer>ENTER NUMBER OF GAMES TO START</footer>

    <script src="index.JS"></script>
</body>
</html>
